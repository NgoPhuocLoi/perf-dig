services:
  prometheus:
    image: prom/prometheus:v3.5.0
    # Host networking so Prometheus can scrape the Quarkus app, which binds to localhost in dev mode.
    # UI is served on http://localhost:9090
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.0.0
    # Host networking so Grafana reaches Prometheus on localhost:9090.
    # UI is served on http://localhost:3000
    network_mode: host
    environment:
      # Local dev only: open without login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
