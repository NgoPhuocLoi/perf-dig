quarkus.micrometer.export.json.enabled=true 
quarkus.micrometer.export.json.path=metrics/json
quarkus.micrometer.export.prometheus.path=metrics/prometheus
quarkus.datasource.jdbc.telemetry=true

# --- Tracing: send spans to Tempo from docker-compose, not the LGTM Dev Service ---
# quarkus-opentelemetry would otherwise start a grafana/otel-lgtm container in dev mode
quarkus.observability.enabled=false
# Tempo's OTLP gRPC receiver (docker-compose, host network). This is also Quarkus' default.
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317

deployment.env=DEV

# --- Postgres (Agroal pool, shared by plain JDBC and Hibernate ORM) ---
quarkus.datasource.db-kind=postgresql

# Dev mode uses the local pglab container (orders: 50M rows). Tests have no %test URL,
# so Quarkus Dev Services starts a throwaway Postgres for them.
%dev.quarkus.datasource.username=lab
%dev.quarkus.datasource.password=lab
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/lab

# Connection pool metrics (agroal_*) in /q/metrics
quarkus.datasource.metrics.enabled=true


# Logs
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
quarkus.http.access-log.enabled=true

# --- Hibernate ORM (Customer, CustomerOrder entities) ---
%dev.quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.fetch.batch-size=-1
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.statistics=true


quarkus.log.file.enabled=true
quarkus.log.file.path=target/dev.log

# Tests: Dev Services Postgres on the same major version as pglab
%test.quarkus.datasource.devservices.image-name=postgres:17
